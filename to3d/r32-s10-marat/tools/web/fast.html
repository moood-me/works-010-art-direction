<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Марат в 3D, на видеокарте</title>
<style>
  :root { --paper: #f4ecd8; --panel: #dbe3c8; --ink: #1b1714; --mute: #6b5f52; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #stage { flex: 1; position: relative; min-height: 0; }
  #stage canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--mute); }
  #bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px;
    border-top: 2px solid var(--ink); background: var(--paper); }
  #bar label { display: inline-flex; align-items: center; gap: 6px; }
  #bar select, #bar button { font: inherit; padding: 3px 8px; border: 1.5px solid var(--ink); border-radius: 4px;
    background: #fbf8ee; color: var(--ink); }
  #bar button.on { background: var(--ink); color: var(--paper); }
  #time { flex: 1 1 200px; }
  #expr { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  #expr label { font-size: 13px; }
  #expr input { width: 70px; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="wrap">
  <div id="stage"><div id="msg">загрузка…</div></div>
  <div id="bar">
    <button id="play" class="on">❚❚</button>
    <input id="time" type="range" min="0" max="1" step="0.001" value="0" aria-label="время">
    <label>движение <select id="motion"></select></label>
    <label><input id="talk" type="checkbox"> говорит</label>
    <div id="expr"></div>
  </div>
</div>
<script type="module" src="view-gpu.mjs"></script>
</body>
</html>
