<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Марат в 3D</title>
<style>
:root { --bg: #efe2c4; --ink: #2a221e; --muted: #7a6a58; --line: #d4c4a2; --on: #2a221e; --onInk: #f6efe0; --panel: rgba(246, 239, 224, 0.93); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --panel: rgba(246, 239, 224, 0.95); } }
:root[data-theme="dark"] { --panel: rgba(246, 239, 224, 0.95); }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
#cv { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
#msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 18px; pointer-events: none; }
#ui { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(780px, calc(100vw - 32px)); box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: none; gap: 6px; }
#ui.on { display: grid; }
#ui.folded > :not(:first-child) { display: none; }
#ui.folded { width: auto; left: auto; right: 12px; transform: none; padding: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row .label { color: var(--muted); font-size: 12px; width: 74px; flex: none; }
button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--on); color: var(--onInk); border-color: var(--on); }
input[type=range] { flex: 1; min-width: 120px; accent-color: #2a221e; }
.mix { display: none; gap: 6px 14px; flex-wrap: wrap; }
.mix.on { display: flex; }
.mix label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.mix input { width: 90px; min-width: 0; flex: none; }
#time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; width: 60px; text-align: right; }
@media (max-width: 520px) { .row .label { width: 100%; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="msg">собирается…</div>
<div id="ui">
  <div class="row" style="justify-content:flex-end;margin-bottom:-4px"><button id="fold">свернуть</button></div>
  <div class="row"><span class="label">Движение</span><span id="clips" class="row"></span></div>
  <div class="row"><span class="label">Лицо</span><span id="exprs" class="row"></span><button id="mixb" aria-pressed="false">смешать</button><button id="talk" aria-pressed="false">говорит</button></div>
  <div class="row mix" id="mix"></div>
  <div class="row"><span class="label">Плёнка</span><button id="film" aria-pressed="true">цвет</button><button id="bw" aria-pressed="false">чёрно-белая</button><button id="close" aria-pressed="false">лицо крупно</button></div>
  <div class="row"><button id="play" aria-pressed="true">пауза</button><input id="scrub" type="range" min="0" max="1" step="0.001" value="0"><span id="time">0.0 с</span></div>
</div>
<script type="module" src="app.js"></script>
<script type="module" src="ui.js"></script>
</body>
</html>
