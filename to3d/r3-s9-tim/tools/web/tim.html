<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Тим 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#7fc4c0;font:14px Georgia,serif;color:#2a201c}
#c{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:grab}
#out{position:absolute;left:0;top:0}
#ui{position:absolute;left:12px;top:12px;background:rgba(243,234,214,.92);border-radius:8px;padding:10px 12px;max-width:340px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#ui .row{margin:6px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#ui button{font:inherit;border:1px solid #b9a98c;background:#fbf6ea;border-radius:5px;padding:3px 8px;cursor:pointer}
#ui button.on{background:#c8402f;color:#fbf6ea;border-color:#a8341f}
#ui select{font:inherit}
#ui input[type=range]{flex:1;min-width:160px}
#hint{position:absolute;right:12px;bottom:10px;opacity:.6;font-size:12px}
body.shots #ui,body.shots #hint{display:none}body.shots{background:transparent}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head><body><canvas id="c"></canvas><svg id="out" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="ui">
  <div class="row"><b>Тим</b>&nbsp;· движение:&nbsp;<select id="motion"></select></div>
  <div class="row" id="exprs"></div>
  <div class="row"><button id="play">пауза</button><button id="talk">говорит</button><span id="time"></span></div>
  <div class="row"><input id="scrub" type="range" min="0" max="1" step="any" value="0"></div>
</div>
<div id="hint">вращать — мышью, приблизить — колёсиком</div>
<script type="module" src="tim.js"></script>
<script type="module" src="ui.js"></script></body></html>
