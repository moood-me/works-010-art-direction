<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Кира 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d5d9c4;font:14px Georgia,'PT Serif',serif;color:#3a2f33}
#c{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:grab}
#ui{position:absolute;left:12px;top:12px;background:rgba(247,242,231,.94);border-radius:6px;padding:10px 12px;max-width:350px;box-shadow:2px 3px 5px rgba(43,27,44,.28)}
#ui .row{margin:6px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#ui button{font:inherit;border:1px solid #b7ad9c;background:#fbf6ea;border-radius:4px;padding:3px 8px;cursor:pointer;color:inherit}
#ui button.on{background:#5b2f57;color:#fbf6ea;border-color:#44213f}
#ui select{font:inherit}
#ui input[type=range]{flex:1;min-width:160px}
#hint{position:absolute;right:12px;bottom:10px;opacity:.6;font-size:12px}
body.shots #ui,body.shots #hint{display:none}body.shots{background:transparent}
</style>

  <div class="row"><button id="play">пауза</button><button id="talk">говорит</button><button id="close">лицо ближе</button><span id="time"></span></div>
