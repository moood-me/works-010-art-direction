<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#cfc8bd}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const q = new URLSearchParams(location.search);
const names = q.get('set').split(','), labels = (q.get('labels') || '').split('|');
const yaw = +(q.get('yaw') || 0.35), W = +(q.get('w') || 1600), H = +(q.get('h') || 700);
const focus = q.get('focus') || 'full';   // full | head | torso
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#cfc8bd');
scene.add(new THREE.HemisphereLight('#fff4e6', '#5b544c', 1.05));
const key = new THREE.DirectionalLight('#fff0dc', 2.1); key.position.set(-2.2, 3.6, 2.6); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); Object.assign(key.shadow.camera, { left: -12, right: 12, top: 3, bottom: -1, near: 0.5, far: 20 }); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; scene.add(key);
const rim = new THREE.DirectionalLight('#cfe0ff', 1.3); rim.position.set(2.4, 2.2, -2.8); scene.add(rim);
const fill = new THREE.DirectionalLight('#ffe6cc', 0.35); fill.position.set(2.5, 1.0, 2.0); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: '#c9c1b5', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const faces = new Uint16Array(await (await fetch('out/faces.bin')).arrayBuffer()), mfaces = new Uint16Array(await (await fetch('out/mfaces.bin')).arrayBuffer());
const mat = new THREE.MeshStandardMaterial({ color: '#d9b49a', roughness: 0.65 });
const bodies = [];
for (const n of names) {
  const p = new Float32Array(await (await fetch('out/' + n + '.bin')).arrayBuffer());
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setIndex(new THREE.BufferAttribute((n.startsWith('m-') || n.startsWith('d-')) ? mfaces : faces, 1)); g.computeVertexNormals(); g.computeBoundingBox();
  const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true; m.rotation.y = yaw; scene.add(m); bodies.push(m);
}
// lay out in a row, spacing by the tallest
const hmax = Math.max(...bodies.map(b => b.geometry.boundingBox.max.y));
const gap = +(q.get('gap') || (focus === 'head' ? 0.42 : 0.95 * Math.max(0.5, hmax / 1.75)));
bodies.forEach((b, i) => { b.position.x = (i - (bodies.length - 1) / 2) * gap; if (focus === 'head') b.position.y = hmax - b.geometry.boundingBox.max.y; });
const span = (bodies.length - 1) * gap + gap;
const cam = new THREE.PerspectiveCamera(22, W / H, 0.05, 100);
let cy, vh;
if (focus === 'head') { const hy = Math.max(...bodies.map(b => b.geometry.boundingBox.max.y)); cy = hy - 0.13; vh = 0.42; }
else if (focus === 'torso') { cy = hmax * 0.62; vh = hmax * 0.55; }
else { cy = hmax * 0.5; vh = hmax * 1.12; }
const dist = Math.max(vh / 2 / Math.tan(11 * Math.PI / 180), span / 2 / Math.tan(11 * Math.PI / 180) / (W / H));
cam.position.set(0, cy + dist * 0.06, dist); cam.lookAt(0, cy, 0);
renderer.render(scene, cam);
// labels
const c2 = document.createElement('canvas'); c2.width = W; c2.height = 28; const x = c2.getContext('2d'); x.fillStyle = '#3a332c'; x.font = '15px sans-serif'; x.textAlign = 'center';
bodies.forEach((b, i) => { const v = b.position.clone(); v.y = 0; v.project(cam); x.fillText(labels[i] || names[i], (v.x + 1) / 2 * W, 18); });
document.body.appendChild(c2);
window.__done = true;
</script></body></html>
