<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hair</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#d8d2c8;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { STYLES } from './styles.js';
import { buildHair, headSDF, surfaceNets } from './hair.js';

const qs = new URLSearchParams(location.search);
const W = +(qs.get('w') || 520), H = +(qs.get('h') || 620);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); document.body.appendChild(renderer.domElement);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd8d2c8);
const camera = new THREE.PerspectiveCamera(22, W / H, 0.05, 10);
scene.add(new THREE.HemisphereLight(0xfff6ea, 0x6d6070, 1.25));
const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(1.2, 2.2, 2.4); scene.add(key);
const rim = new THREE.DirectionalLight(0xdfe8ff, 1.1); rim.position.set(-1.6, 1.4, -2.0); scene.add(rim);

const grad = (() => { const d = new Uint8Array([90, 90, 90, 255, 165, 165, 165, 255, 225, 225, 225, 255, 255, 255, 255, 255]); const t = new THREE.DataTexture(d, 4, 1); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const MAT = qs.get('mat') || 'soft';
const mat = (color, o = {}) => MAT === 'toon' ? new THREE.MeshToonMaterial({ color, gradientMap: grad, vertexColors: !!o.vc })
  : new THREE.MeshStandardMaterial({ color, roughness: o.rough ?? 0.55, metalness: 0, vertexColors: !!o.vc });
const INK = new THREE.MeshBasicMaterial({ color: 0x24161a, side: THREE.BackSide });
const group = new THREE.Group(); scene.add(group);
function meshOf(m, color, o = {}) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(m.pos, 3)); g.setAttribute('normal', new THREE.BufferAttribute(m.nor, 3));
  if (m.col) g.setAttribute('color', new THREE.BufferAttribute(m.col, 3));
  g.setIndex(Array.from(m.idx));
  const mesh = new THREE.Mesh(g, mat(color, o)); group.add(mesh);
  if (o.ink !== 0) {
    const g2 = g.clone(), p = g2.attributes.position, n = g2.attributes.normal, th = o.ink ?? 0.0012;
    for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + n.getX(i) * th, p.getY(i) + n.getY(i) * th, p.getZ(i) + n.getZ(i) * th);
    group.add(new THREE.Mesh(g2, INK));
  }
  return mesh;
}

const name = qs.get('s') || Object.keys(STYLES)[0];
const S = STYLES[name];
// the neutral head and shoulders — not judged, only there to carry the hair
const hd = headSDF(S.head || {});
const hm = surfaceNets(hd.sdf, [-0.2, -0.36, -0.15], [0.2, 0.16, 0.16], 0.0035);
meshOf(hm, S.skin || 0xe9c2a6, { ink: 0.0009 });
for (const e of hd.eyes) { const s = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), new THREE.MeshStandardMaterial({ color: 0x2a1c1e, roughness: 0.3 })); s.position.set(...e.c); s.scale.set(...e.r); group.add(s);
  const g = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffff })); g.position.set(e.c[0] + e.r[0] * 0.35, e.c[1] + e.r[1] * 0.4, e.c[2] + e.r[2] * 0.8); g.scale.setScalar(0.0022); group.add(g); }
// ———— hair shading: strands along each lock, an anisotropic highlight band, darker roots and inner layers ————
const HAIR_V = `
attribute vec3 hairT; attribute vec2 hairUV; attribute float seed; attribute float ao; attribute vec3 color;
varying vec3 vN; varying vec3 vT; varying vec3 vP; varying vec2 vUV; varying float vSeed; varying float vAO; varying vec3 vCol;
void main() {
  vec4 wp = modelMatrix * vec4(position, 1.0); vP = wp.xyz;
  vN = normalize(mat3(modelMatrix) * normal); vT = normalize(mat3(modelMatrix) * hairT);
  vUV = hairUV; vSeed = seed; vAO = ao; vCol = color;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const HAIR_F = `
uniform vec3 keyDir; uniform vec3 keyCol; uniform vec3 rimDir; uniform vec3 rimCol; uniform vec3 sky; uniform vec3 ground;
uniform float inner; uniform float spec1; uniform float spec2; uniform float shift; uniform float strands;
varying vec3 vN; varying vec3 vT; varying vec3 vP; varying vec2 vUV; varying float vSeed; varying float vAO; varying vec3 vCol;
float h1(float x) { return fract(sin(x * 127.1) * 43758.5453); }
float n1(float x) { float i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f); return mix(h1(i), h1(i + 1.0), f); }
float kk(vec3 T, vec3 H, float e) { float t = dot(T, H); return pow(max(0.0, sqrt(max(0.0, 1.0 - t * t))), e); }
void main() {
  vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
  vec3 T = vT - N * dot(vT, N); T = length(T) > 1e-4 ? normalize(T) : vec3(0.0, -1.0, 0.0);
  vec3 V = normalize(cameraPosition - vP);
  float a = vUV.x, s = vUV.y;
  // strands: fine lines across the lock, coarser bundles, both running along it
  // each scale fades to its mean where it would be finer than a pixel
  float fw = fwidth(a) + 1e-6;
  float fine = mix(n1(a * 1400.0 + vSeed * 91.0 + s * 2.0), 0.5, clamp(fw * 1400.0 - 1.0, 0.0, 1.0));
  float mid = mix(n1(a * 520.0 + vSeed * 37.0 + s * 1.2), 0.5, clamp(fw * 520.0 - 1.0, 0.0, 1.0));
  float big = mix(n1(a * 160.0 + vSeed * 13.0), 0.5, clamp(fw * 160.0 - 1.0, 0.0, 1.0));
  float str = mix(0.5, fine * 0.5 + mid * 0.35 + big * 0.15, strands * (inner < 0.99 ? 0.5 : 1.0));
  vec3 alb = vCol * mix(0.5, 1.0, smoothstep(0.0, 0.4, s)) * (0.88 + 0.24 * str) * (0.9 + 0.2 * h1(vSeed * 71.0 + 3.0)) * mix(inner, 1.0, smoothstep(0.55, 0.95, vAO));
  float ao = vAO;
  vec3 irr = mix(ground, sky, 0.5 * N.y + 0.5) * mix(0.45, 1.0, ao);
  float nl = dot(N, keyDir);
  irr += keyCol * clamp((nl + 0.25) / 1.25, 0.0, 1.0) * mix(0.55, 1.0, ao);
  irr += rimCol * clamp(dot(N, rimDir), 0.0, 1.0) * ao;
  vec3 col = alb * irr / 3.14159;
  // the highlight band: two lobes along the strands (Kajiya-Kay), the second tinted and broken by the strands
  vec3 H = normalize(keyDir + V);
  float sh = (str - 0.5) * 0.5;
  float b1 = kk(normalize(T + N * (shift + sh)), H, 90.0);
  float b2 = kk(normalize(T + N * (shift - 0.22 + sh)), H, 22.0) * smoothstep(0.35, 0.75, mid);
  float lit = smoothstep(-0.05, 0.35, nl) * ao * ao;
  vec3 tint = mix(vec3(1.0), vCol / max(max(vCol.r, vCol.g), max(vCol.b, 0.02)), 0.45);
  col += keyCol * (b1 * spec1 * tint * (0.5 + 0.9 * fine) * 0.1 + b2 * spec2 * vCol * 0.5) * lit * inner;
  vec3 Hr = normalize(rimDir + V);
  col += rimCol * kk(normalize(T + N * (shift + sh)), Hr, 60.0) * spec1 * 0.05 * tint * clamp(dot(N, rimDir) + 0.3, 0.0, 1.0) * ao * inner;
  gl_FragColor = vec4(col, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;
const L3 = (v, s) => new THREE.Vector3(...v).normalize();
function hairMat(o) {
  return new THREE.ShaderMaterial({ vertexShader: HAIR_V, fragmentShader: HAIR_F, side: THREE.DoubleSide, uniforms: {
    keyDir: { value: L3([1.2, 2.2, 2.4]) }, keyCol: { value: new THREE.Color(0xffffff).multiplyScalar(2.1) },
    rimDir: { value: L3([-1.6, 1.4, -2.0]) }, rimCol: { value: new THREE.Color(0xdfe8ff).multiplyScalar(1.1) },
    sky: { value: new THREE.Color(0xfff6ea).multiplyScalar(1.25) }, ground: { value: new THREE.Color(0x6d6070).multiplyScalar(1.25) },
    inner: { value: o.inner ? (S.innerDark ?? 0.8) : 1 }, spec1: { value: S.spec ?? 1 }, spec2: { value: S.spec2 ?? 0.6 },
    shift: { value: S.shift ?? 0.12 }, strands: { value: qs.get('strands') === '0' ? 0 : 1 } } });
}
function hairMesh(m, o) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(m.pos, 3)); g.setAttribute('normal', new THREE.BufferAttribute(m.nor, 3));
  g.setAttribute('hairT', new THREE.BufferAttribute(m.tan, 3)); g.setAttribute('hairUV', new THREE.BufferAttribute(m.uv, 2));
  g.setAttribute('seed', new THREE.BufferAttribute(m.seed, 1)); g.setAttribute('ao', new THREE.BufferAttribute(m.ao, 1));
  g.setAttribute('color', new THREE.BufferAttribute(m.col, 3));
  g.setIndex(Array.from(m.idx));
  group.add(new THREE.Mesh(g, hairMat(o)));
  const th = o.ink ?? (qs.has('ink') ? +qs.get('ink') : o.locks ? 0.0006 : 0.0009);
  if (th > 0) {   // the outline: thinner where the lock thins, so tips stay sharp
    const g2 = g.clone(), p = g2.attributes.position, n = g2.attributes.normal;
    for (let i = 0; i < p.count; i++) { const k = th * (m.wd ? Math.min(1, Math.max(0.1, m.wd[i] / 0.006)) : 1); p.setXYZ(i, p.getX(i) + n.getX(i) * k, p.getY(i) + n.getY(i) * k, p.getZ(i) + n.getZ(i) * k); }
    group.add(new THREE.Mesh(g2, INK));
  }
}
addEventListener('error', e => { window.__err = e.message; });
const t0 = performance.now();
if (qs.get('only')) S.parts[0].items = [S.parts[0].items.flat(Infinity)[+qs.get('only')]];
const parts = buildHair(S, hd.sdf);
for (const p of parts) {
  if (p.plain) { const c = p.mesh.col; p.mesh.col = null; meshOf(p.mesh, S.parts.find(q => q.fabric).color, { rough: p.rough ?? 0.8, ink: p.ink }); continue; }
  if (qs.get('dbg') === 'inner' && p.inner) p.mesh.col = p.mesh.col.map((v, i) => [1, 0, 1][i % 3]);
  hairMesh(p.mesh, { inner: p.inner, locks: p.lockLayer, ink: p.ink });
}
window.__ms = performance.now() - t0;

const views = { front: 0, tq: 0.65, side: 1.5708, back: Math.PI, tql: -0.65 };
window.view = (v, dist = 1.15, ty = -0.03, pitch = 0.04) => {
  const a = typeof v === 'number' ? v : views[v];
  camera.position.set(Math.sin(a) * dist * Math.cos(pitch), ty + Math.sin(pitch) * dist, Math.cos(a) * dist * Math.cos(pitch));
  camera.lookAt(0, ty, 0); renderer.render(scene, camera);
};
window.view(qs.get('v') || 'front', +(qs.get('d') || S.dist || 1.15), +(qs.get('ty') || S.ty || -0.03));
// the gallery's viewer: the hairstyle turned by the camera, no motion
if (qs.has('viewer')) {
  const RU = { gwen: 'Гвен: каре с пробором', gogo: 'Гоу-Гоу: тёмное каре с прядью', jack: 'Джек: растрёпанные белые', marco: 'Марко: чёлка набок', ginger: 'рыжий мальчик: начёс', ariel: 'рыжая девушка: длинные', doll: 'девочка-кукла: фиолетовые', kbuns: 'K-pop: пучки', kbraid: 'K-pop: коса', kpony: 'K-pop: хвост', giulia: 'Джулия: кудри под шапкой', alva: 'Альва: шторка', nimona: 'Нимона: вихры', anime: 'аниме: чёлка и длинные' };
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  window.__vp = { kind: 'adapter', THREE, stage: renderer.domElement, adapter: {
    chars: Object.keys(STYLES).map(id => ({ id, label: RU[id] || id })), current: name, noMotion: true, camera, renderer,
    render: () => renderer.render(scene, camera), view0: { yaw: 0.6, pitch: 0.04, dist: S.dist || 1.15 }, target: new THREE.Vector3(0, S.ty || -0.03, 0),
    show(c) { const q = new URLSearchParams(location.search); q.set('s', c.id); location.search = q.toString(); },
  } };
  import('../../gallery/player.js');
}
window.__ready = true;
</script></body></html>
