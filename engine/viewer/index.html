<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine viewer</title>
<style>
  :root { --panel: rgba(250,247,242,.94); --ink: #26231f; --muted: #75706a; --line: #d5cec4; --accent: #b4532a; --bg: #cfc8bd; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
  #cv:active { cursor: grabbing; }
  #vpPanel { position: fixed; left: 12px; top: 12px; z-index: 2; background: var(--panel); border-radius: 10px; padding: 10px 12px; box-shadow: 0 2px 12px rgba(0,0,0,.18);
    display: grid; gap: 7px; width: min(400px, calc(100vw - 48px)); max-height: calc(100vh - 48px); overflow-y: auto; }
  #vpPanel .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #vpPanel .lab { color: var(--muted); font-size: 12px; min-width: 64px; }
  #vpPanel select, #vpPanel button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 3px 8px; color: var(--ink); cursor: pointer; }
  #vpPanel button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #vpPanel .mv { display: flex; flex-wrap: wrap; gap: 4px; }
  #vpPanel input[type=range] { flex: 1; min-width: 120px; }
  #vpPanel .hint { color: var(--muted); font-size: 12px; }
  #vpPanel .sep { border-top: 1px solid var(--line); margin: 2px 0; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; font: italic 20px Georgia, serif; color: #4a4640; pointer-events: none; z-index: 3; }
  @media (max-width: 520px) { #vpPanel { left: 8px; top: 8px; width: calc(100vw - 32px); max-height: 45vh; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="msg">собирается…</div>
<script type="module" src="viewer.js"></script>
</body>
</html>
