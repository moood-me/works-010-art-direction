<title>Art direction gallery</title>
<style>

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; }

  aside h1 { font-size: 17px; margin: 0 8px 2px; }
  aside .sub { color: var(--muted); font-size: 12px; margin: 0 8px 14px; }
  .gt { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 8px 4px; }

  aside a .n { color: var(--accent); font-weight: 700; min-width: 26px; }
  aside a .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; flex: none; background: currentColor; }
  main { flex: 1; min-width: 0; padding: 24px 28px 64px; max-width: 1300px; }

  .st { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }

  .rel { margin: 0 0 6px; font-size: 13px; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--card); max-width: 900px; }

  .d3bar { display: flex; gap: 12px; align-items: center; padding: 8px 14px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 14px; }
  .d3bar b { color: var(--accent); }
  .d3bar .note { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; }
  .d3bar button { font: inherit; font-size: 14px; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; white-space: nowrap; }
  .d3box { position: relative; flex: 1; min-height: 0; }
  .v3d { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #d8d2c8; }
  .v3dwait { position: absolute; inset: 0; display: grid; place-items: center; background: #d8d2c8; color: #4a4640; font: italic 20px Georgia, serif; text-align: center; padding: 20px; }
  @media (max-width: 760px) { .d3.on { left: 0; } }
  .what { color: var(--muted); margin: 0 0 6px; max-width: 900px; }
  .verdict { margin: 0 0 16px; max-width: 900px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: zoom-in; }
  figure img { display: block; width: 100%; height: 260px; object-fit: contain; background: #d9d4cb; }
  figure:hover { border-color: var(--accent); }
  figcaption { padding: 8px 10px; font-size: 13px; }
  figcaption b { color: var(--accent); margin-right: 4px; }
  #menuSel { display: none; }
  #lb { position: fixed; inset: 0; background: rgba(12,11,10,.92); display: none; z-index: 10; flex-direction: column; }
  #lb.on { display: flex; }
  #lb .imgbox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px 64px 0; }
  #lb img { max-width: 100%; max-height: 100%; object-fit: contain; background: #d9d4cb; border-radius: 4px; }
  #lb .cap { color: #eee; text-align: center; padding: 10px 16px 16px; font-size: 14px; }
  #lb .cap b { color: #f0a070; margin-right: 6px; }
  #lb button { position: absolute; background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 50%; width: 44px; height: 44px; font-size: 22px; cursor: pointer; }
  #lb button:hover { background: rgba(255,255,255,.25); }
  #lbPrev { left: 12px; top: 50%; } #lbNext { right: 12px; top: 50%; } #lbClose { right: 12px; top: 12px; }
  @media (max-width: 760px) {
    body { display: block; } aside { display: none; }

    main { padding: 16px; } #lb .imgbox { padding: 12px 8px 0; } #lbPrev, #lbNext { top: auto; bottom: 56px; }
  }
</style>

  { title: 'В — Волосы', items: [
    { id: 'В1', rel: 'Отдельный путь. Причёски на пустых головах. В движке — Д8–Д10 (её построители, причёски и симуляция; другой свет).', name: 'Волосы: пряди по кривым, в движении', st: 'good', stt: '12 из 14 читаются, двигаются',
      what: 'Свой инструмент: причёска из нескольких частей, внутри части всё слито в одну поверхность; пряди-объёмы по направляющим кривым с острыми или мягкими кончиками; чёлка, коса, кудри, пучки. Пряди можно потом повесить на кости. Движутся: каждая прядь — цепочка на кости головы с инерцией, ветром с порывами и столкновениями с головой, шеей, плечами, телом и полом; на женщине, мужчине и ребёнке, в 13 движениях Kimodo. Живой вид: страница волос без параметров.',
      verdict: 'После «все пластилиновые!»: пряди отдельными поверхностями с тонкими кончиками, тёмный внутренний слой между прядями, направление волосков и полоса блика. Хорошо: Гоу-Гоу, Марко, пучки, коса и хвост K-pop, кудри Джулии, Нимона, кукла, Альва, аниме-девушка. Средне: Гвен, Ариэль. Слабо: Джек, рыжий мальчик.',
      pics: [['hair/sheet-short.png', 'короткие: Гвен, Гоу-Гоу, Марко'], ['hair/sheet-tied-curly.png', 'собранные и кудри: пучки, коса, хвост, Джулия, Нимона'], ['hair/sheet-long.png', 'длинные: кукла, Альва, аниме-девушка, Ариэль'], ['hair/sheet-unfinished.png', 'недоделанные: Джек, рыжий мальчик'], ['hair/motion/kpony-run.gif', 'хвост K-pop: бег'], ['hair/motion/gwen-walk-w12.gif', 'Гвен: шаг на ветру'], ['hair/motion/ariel-walk-w3.gif', 'Ариэль: шаг, сильный ветер'], ['hair/motion/giulia-dance.gif', 'кудри Джулии: танец'], ['hair/motion/kbraid-idle-snap.gif', 'коса: резкие повороты головы'], ['hair/motion/alva-lie.gif', 'Альва: лечь'], ['hair/motion/anime-roll.gif', 'аниме-девушка: кувырок'], ['hair/motion/jack-run.gif', 'Джек: бег'], ['hair/motion/sheet-rest.png', 'в покое: задумано и после симуляции, все 14'], ['hair/motion/sheet-long.png', 'длинные в движениях'], ['hair/motion/sheet-floor.png', 'лёжа, кувырок, сидя']] },
  ]},
  { title: 'О — Одежда', items: [
    { id: 'О1', rel: 'Вырос из О2: та же одежда MakeHuman, но перерисованная своей формой. Тела под ней — из О2; переносится на Т7 и каркас Т6. В движке — Д13 (силуэты как форма, к которой тянется ткань О3; лестница до знака не перенесена).', name: 'Одежда: своя форма и упрощение', st: 'good', stt: 'нравится',
      what: 'Вещь читается вокруг оси и рисуется заново: силуэт, жёсткость, откуда висит, складки как рисунок. Упрощение вместе с телом: ткань → форма со складками → гладкая форма → знак. В движении — физика ткани с нарисованной формой покоя.',
      verdict: 'Павел: «одежда и силуэты, фигура и всё это упрощение — вообще потрясающе»; физика в движении — «чудесно». Тела под одеждой уродливы — одежду переносят на хорошие тела.',
      pics: [['clothes/dresses.png', '8 силуэтов одного платья'], ['clothes/ladder.png', 'лестница упрощения трёх вещей'], ['clothes/sE-Abodies-1.png', 'на хороших телах: дама-Дисней, мужчина, «яйцо», «песочные часы», «фасолина»'], ['clothes/sE-Abodies-2.png', 'на хороших телах: бабушка, старик, мальчик и девочка аниме, ребёнок, «клин»'], ['clothes/sE-kids.png', 'на старых телах Б: принцесса, малышка, бабушка, учительница'], ['clothes/motion/sM-bell.png', 'в движении: 3 способа, внизу физика'], ['clothes/motion/gif-phys-bell-walk.gif', 'шаг с физикой ткани'], ['clothes/sE-phys-jump-sit.png', 'физика: колокол сидя, юбка со свитером в прыжке и сидя']] },
    { id: 'О2', rel: 'Направление Б. Основа «тело + одежда» для О1; лица отсюда не берём. Вещи MakeHuman отсюда — исходные сетки одежды движка (Д11).', name: 'Одежда MakeHuman на теле, с лицами (Б)', st: 'mid', stt: 'основа «тело + одежда»',
      what: 'Генератор 72 персонажей: одежда MakeHuman на стилизованном теле, глаза, брови, рот. Дал находки о красоте.',
      verdict: 'Павел: тела и одежда хорошо, лица плохо. Решено: брать как основу «тело + одежда», голову — из работ по головам.',
      pics: [['dressed/best-of-72.png', 'лучшие 12 из 72'], ['dressed/lid-open-vs-heavy.png', 'открытое и тяжёлое веко']] },
    { id: 'О3', rel: 'Отдельный путь: настоящая ткань (физика), обычная современная одежда. Не связан с О1 (там нарисованная форма). В движке — основа одежды Д11–Д12 (её ткани, выкройки и симуляция).', name: 'Одежда: настоящая ткань в движении', st: 'good', stt: 'работает',
      what: 'Каждая вещь — ткань своего материала: вес, растяжение, изгиб, трение, ветер; не проходит сквозь тело, другую одежду, пол и саму себя. 11 вещей (платье, юбка, футболка, свитер, брюки, шорты, блузка, кардиган, куртка, купальник, шарф), 16 тканей, на женщине, мужчине, ребёнке. Шаг, бег, прыжок, танец, сесть, лечь, кувырок, перекат, ветер.',
      verdict: 'Сидя юбка ложится на колени. Осталось: при глубоком сгибе колена ткань на несколько кадров прокалывается; задравшиеся джинсы и футболка остаются задранными; складка у блузки под грудью.',
      pics: [['cloth/w-dress-idle-wind.gif', 'шифоновое платье на ветру'], ['cloth/w-blouse-walk.gif', 'блузка и юбка: шаг'], ['cloth/w-blouse-sit.gif', 'блузка и юбка: сесть на пол'], ['cloth/m-jeans-rollover.gif', 'мужчина в джинсах: лечь и перекатиться'], ['cloth/w-tee-roll.gif', 'футболка: кувырок'], ['cloth/c-skirt-run.gif', 'ребёнок в юбке: бег'], ['cloth/m-jacket-walk-wind.gif', 'куртка: шаг на ветру'], ['cloth/w-cardigan-jump.gif', 'кардиган: прыжок'], ['cloth/fabrics-1.png', 'каждая вещь в разных тканях, шаг на ветру (1)'], ['cloth/fabrics-2.png', 'каждая вещь в разных тканях (2)'], ['cloth/w-dress-lie.png', 'платье: лечь'], ['cloth/w-swim-roll.png', 'купальник: кувырок'], ['cloth/c-sweater-roll.png', 'ребёнок в свитере: кувырок'], ['cloth/m-sweater-sit.png', 'мужчина в свитере: сесть'], ['cloth/w-jacket-dance.png', 'куртка: танец']] },
  ]},
  { title: 'П — Готовые персонажи', items: [
    { id: 'П1', rel: 'Отдельный путь, свой конструктор из простых форм (не Anny). Движения Kimodo.', name: 'Персонажи: инди-герои', st: 'good', stt: 'нравится',
      what: 'Конструктор из простых форм на суставах SOMA: шары, капли, цилиндры, вещи как часть силуэта, нечеловеческие герои. Цвет и контур, лица с чувствами, позы с линией действия.',
      verdict: 'Павел: «о классссс! :3», «развей их, делай ещё и стильнее». Движения Kimodo садятся на большинство.',
      pics: [['indie/v2-party.png', '24 героя, у каждого своя поза и чувство'], ['indie/v2-faces.png', '7 выражений на 4 героях'], ['indie/v2-poses.png', 'позы'], ['indie/motion/gif-walk.gif', 'Kimodo: шаг'], ['indie/motion/gif-dance.gif', 'Kimodo: танец'], ['indie/motion/gif-stomp.gif', 'Kimodo: топает']] },
    { id: 'П2', rel: 'Отдельный путь, свои персонажи на скелете SOMA (не Anny). v1 и v2 рядом.', name: 'Персонажи: выразительные, руки-шланги', st: 'good', stt: 'нравится',
      what: 'Свои персонажи на скелете SOMA: лицо — рисунок на голове, руки и ноги гнутся дугой, язык форм на пределе. Вторая версия: нарисованные туловища и сужающиеся ноги.',
      verdict: 'Павел: «супер охуенно и супер ценно… я люблю тут всех персонажей». Вторая версия «стала лучше, отлично», первая сохранена.',

  ]},
  { title: 'Д — Движок', items: [
    { id: 'Д1', rel: 'Основа движка (engine/): одно описание тела, один скиннинг, один формат движений Kimodo и один перенос на тело. На нём строятся тела, головы, волосы, одежда.', name: 'Движок: тела Anny в движениях Kimodo', st: 'mid', stt: 'основа',
      what: 'Тела moood (женщина, мужчина, ребёнок…) и тела Т8 с настоящими суставами (регрессия суставов самой Anny) в движениях Kimodo со всеми 77 суставами: тело идёт по пути Kimodo (масштаб по длине ног), а не шагает на месте; цепочки движений, сделанных Kimodo одно после другого, со стыком, сглаженным за 12 кадров (у самого Kimodo там дёргается стопа); скиннинг с центрами вращения (без «конфетной обёртки» и без вздутия на сгибах); поправки Т7 и поправки поверх Kimodo — слоями позы или изменением покоя. После ревью: несколько фигур сразу, капсулы тела для волос и одежды, проверка числами и картинками.',
      verdict: '',
      pics: [['engine/bodies.png', 'тела moood и Т8 в шаге'], ['engine/motions-front.png', 'женщина, мужчина, ребёнок: движения спереди'], ['engine/motions-side.png', 'то же сбоку'], ['engine/travel.png', 'бег: тело идёт по пути Kimodo, камера стоит'], ['engine/travel-walk.png', 'шаг по пути Kimodo, путь на полу'], ['engine/chain.png', 'цепочка «ложится → перекатывается»: стык на кадре 180'], ['engine/join.png', 'стык крупно: как сделал Kimodo и сглаженный'], ['engine/viewer-several.png', 'несколько фигур сразу'], ['engine/capsules.png', 'капсулы тела для волос и одежды'], ['engine/skinning.png', 'сгибы: центры вращения, двойные кватернионы, линейный'], ['engine/viewer.gif', 'просмотрщик: шаг, камера следует']] },
    { id: 'Д2', rel: 'Тела, этап 1 движка (engine/): основы, на которые ставятся деформеры. Т8 — основа; новые тела — сама Anny из её ползунков.', name: 'Тела: основы', st: 'good', stt: 'работает',
      what: 'Основа тела — всегда Anny с её собственными настройками: семь тел moood, 24 тела Т8 (в том числе голова другого возраста на взрослом теле) и 28 новых, сделанных самой Anny из её ползунков (возраст от малыша до пожилых, сложение: худое, полное, мускулистое, высокое, невысокое; ползунки происхождения) — на сетке moood, с суставами по регрессии самой Anny. Все — простые данные (engine/data/bodies, список в index.json, описания новых в data/anny/specs.json): их можно смотреть, сравнивать и делать новые.',
      verdict: 'Ползунки Anny дают живые, реалистичные тела; мультяшной формы сами не дают — её дают деформеры (Д3). Полное сложение — её вес с её же местными ползунками полноты (руки, ноги, шея, талия, бёдра, живот): один вес даёт мало. Происхождение у самой Anny различается немного (лицо — на 2–3 % высоты головы, и рост) — столько и есть.',
      pics: [['engine/bodies/base-anny-age.png', 'новые тела: возраст, женщины и мужчины'], ['engine/bodies/base-anny-build.png', 'новые тела: сложение и ползунки происхождения'], ['engine/bodies/base-moood.png', 'тела moood'], ['engine/bodies/base-t8.png', 'тела Т8 и головы другого возраста']] },
    { id: 'Д3', rel: 'Тела, этап 1 движка: деформеры поверх любой основы. Собраны из Т5 (линии и формы), Т6 (каркас — тот же силуэт по высоте, слит с Т5), Т1 (пропорции, шарж, анатомия), Т9 (сглаживание), Т7 (контуры, массы), Т4 (знак).', name: 'Тела: деформеры', st: 'good', stt: 'работает',
      what: 'Каждый деформер — с силой, в порядке, который выбирает автор, на любом теле, в любом месте и повороте; на покое (кадры суставов держать — форма едет в движении; или повернуть — анатомия) или слоем позы поверх Kimodo каждый кадр: линия действия и контрапост — повороты таза и позвоночника, кости той же длины, стопы на месте; остальные — их же изменение покоя, проведённое через скиннинг. Линия действия C и S спереди и сбоку, сжатие и растяжение с сохранением объёма, контрапост, сужение, прямое против кривого, дуги; силуэт одной фигурой по высоте (14 форм: 10 из Т5 и 4 из каркаса Т6); пропорции частей с суставами; шарж против среднего тела; анатомия чётче и мягче; сглаживание в сантиметрах; контуры Т7 (Дисней, Pixar, аниме — смесь своих радиусов сечения и нарисованных); мягкие массы (грудь, ягодицы, плечо со скатом от шеи); пиктограмма. 64 пресета частей — данные engine/presets.',
      verdict: 'Жёсткого угла у прямоугольника и песочных часов и полки на плечах у перевёрнутой трапеции и V больше нет: профиль сглажен, руки и ноги едут со своим корнем. Пиктограмма — палочка на кость, шары в суставах, свои веса кожи: не рвётся ни в каком движении; сидя с широко разведёнными коленями в паху складка. Ни один деформер не выворачивает треугольники. Поднятая вбок рука у всех тел даёт квадратное плечо — это скиннинг весами Anny, нужны корректирующие формы. Дуги конечностей есть как инструмент; гнуть людей Павел не хотел.',
      pics: [['engine/bodies/silhouettes.png', 'силуэт одной фигурой: 14 форм'], ['engine/bodies/silhouettes-close.png', 'где у Т5 был угол и полка: бёдра и плечи крупно'], ['engine/bodies/silhouettes-strength.png', 'силуэт: сила, мужчина, ребёнок, старик, сбоку'], ['engine/bodies/lines.png', 'линия действия, сжатие, растяжение, контрапост'], ['engine/bodies/limbs.png', 'конечности: сужение, прямое против кривого, дуги'], ['engine/bodies/proportions.png', 'пропорции частей'], ['engine/bodies/surface.png', 'шарж, анатомия, сглаживание в сантиметрах'], ['engine/bodies/contours.png', 'контуры Т7: Дисней, Pixar, аниме'], ['engine/bodies/masses.png', 'мягкие массы: грудь, ягодицы, плечо'], ['engine/bodies/pictogram.png', 'пиктограмма'], ['engine/bodies/pose-layers.png', 'слоем позы и на покое: шаг, лёжа, прыжок; сдвинута и повёрнута']] },
    { id: 'Д4', rel: 'Тела, этап 1 движка: готовые тела — основа (Д2) и пресеты деформеров (Д3), как данные engine/characters; в проверках движка.', name: 'Тела: готовые', st: 'mid', stt: 'примеры',
      what: 'Девять готовых тел, каждое — основа и список пресетов с силами, иногда слой позы: принцесса Диснея, мама Pixar, девушка аниме, тонкий по Бёртону, старушка-груша, герой V, малыш-яйцо, пиктограммы мужчины и женщины. Их можно открыть в 3D, сменить основу, добавить, убрать и подвинуть силу любого деформера; свой персонаж может начаться с любого из них (base) и добавить своё.',
      verdict: 'Читаются как задуманы и держатся в шаге, беге, сидя и лёжа. Это примеры, а не финальные персонажи: головы и лица — следующий этап.',
      pics: [['engine/bodies/presets.png', 'готовые тела спереди и сбоку'], ['engine/bodies/presets-motion.png', 'в движениях Kimodo: шаг, бег, сидит, лежит'], ['engine/bodies/viewer-bodies.png', '3D: основа, деформеры, сила, покой или слой']] },
    { id: 'Д5', rel: 'Головы, этап 2 движка: форма головы. Основа — всегда голова Anny (Д2). Обтяжка на придуманную форму — из Г3, форма из кривых рисунка — из Г1, тело, подогнанное к картинке, и лицо по точкам — из Г2, ползунки лица и голова другого возраста — из Т8, каркас — из Т6.', name: 'Головы: форма', st: 'mid', stt: 'работает',
      what: 'Голова — всегда сетка головы Anny: живая, без шва, движется скелетом. Её форма — набор способов с силой, в порядке автора: ползунки лица самой Anny (129 её местных изменений головы и лица), голова другого возраста, лицо по точкам, каркас на голове, плавные сдвиги; обтяжка на придуманную форму — из кривых рисунка (как Г1) или телом, подогнанным к картинке (как Г2); отдельные куски, где сетка не тянется (длинный нос, нос-шар). Все способы — деформеры движка: на покое или слоем позы, с любым телом и деформерами тел.',
      verdict: 'Способы работают и сочетаются; голову-пресет можно взять частью: ослабить её форму, убрать способ, сменить черту по её имени. Ползунки Anny переносятся через её кожу, натянутую на голову moood: лицо больше не мнётся; но у moood глаза — закрытые щёлки, и её изменения глаз растягивают их (там лицо грубее). Реалистичная голова без придуманной формы — инструмент, не красота сама по себе. Тело по картинке Г2 обтягивается способом Г3 грубо (складка на горле): головы Г2 готовыми не перенесены, есть только форма Джулии как способ.',
      pics: [['engine/heads/form-ways.png', 'способы формы: Anny, другой возраст, точки, каркас, сдвиги, обтяжка+точки'], ['engine/heads/fixes.png', 'после ревью 2: лицо Anny, открытый рот, куски за головой'], ['engine/heads/overlay.png', 'сверка с картинкой: нарисованные черты на коже и контур лица, ошибка в пикселях']] },
    { id: 'Д6', rel: 'Головы, этап 2 движка: черты, выражения, свет. Нарисованные черты и мультяшный свет с контуром — из Г1 и Г3; черты объёмом — новое; выражения сеткой — из Г3 (моргание, челюсть, улыбка) и Г1 (брови).', name: 'Головы: черты, выражения, свет', st: 'mid', stt: 'работает',
      what: 'Черты — отдельный слой, у каждой своё: нарисованы на коже или объёмом (рельеф своей формы на коже, с тем же рисунком); смешиваются. Выражения — сеткой (морфы кожи и сустав челюсти), нарисованные черты следуют за кожей и перерисовываются по выражению (закрытый глаз, улыбка, открытый рот). Свет лица — вариант: мультяшный с контуром, тени от придуманной формы, без падающих теней на лице; или обычный.',
      verdict: 'Моргание, улыбка и брови читаются. Рисунок лежит на коже головы сразу после обтяжки (или на самой Anny), поэтому за кожей идёт при любых изменениях после; рот открывается там, где нарисован: у оскала старика зубы целы. Открытый рот — растянутая тёмная кожа между губами (у сетки Anny рот закрыт), зубов во рту нет. Мультяшный свет: тени ложатся тонами, без серых пятен; блик на носу-шаре — от света. Смешивать выражения — не сейчас.',
      pics: [['engine/heads/expressions.png', 'выражения: покой, моргание, рот, улыбка, брови'], ['engine/heads/features.png', 'черты: рисунком, глаза объёмом, брови и рот объёмом'], ['engine/heads/light.png', 'свет лица: четыре варианта на трёх головах']] },
    { id: 'Д7', rel: 'Головы, этап 2 движка: готовые головы — наши головы Г1 и Г3 как пресеты движка (данные engine/presets, персонажи engine/characters/head-*); их можно взять как часть и изменить.', name: 'Головы: готовые', st: 'mid', stt: 'примеры',
      what: 'Одиннадцать голов: четыре из Г3 (рыжая, старик, парень с длинным носом, женщина в капюшоне) и семь из Г1 — теперь обтянуты сеткой Anny, а не отдельные головы. Каждая — пресет из частей, и части — тоже пресеты: форма, черты, волосы, головной убор; выражения и свет общие. Куски (носы, волосы Г1, уборы) следуют за кожей головы: за выражением, за головой, увеличенной слоем позы. В движениях Kimodo, с поворотами головы от Kimodo, с любым скиннингом и деформерами тел.',
      verdict: 'Головы Г3 и Г1 в движке — как в своих опытах (рядом: опыт и движок). Отличия: тело без одежды (одежда — следующий этап), у Г1 шея и челюсть теперь Anny, волосы — жёсткие куски Г1 и в движении проходят сквозь плечи (волосы — следующий этап); капюшоны и шапки — грубой оболочкой и проходят сквозь плечи (одеждой они станут на этапе одежды).',
      pics: [['engine/heads/presets-g3.png', 'головы Г3: спереди, три четверти, сбоку'], ['engine/heads/presets-g1.png', 'головы Г1 — теперь обтянуты'], ['engine/heads/compare.png', 'рядом: опыт и движок'], ['engine/heads/motion.png', 'в движениях Kimodo'], ['engine/heads/motion-options.png', 'скиннинги и деформеры тел'], ['engine/heads/viewer-heads.png', '3D: голова, форма, черты, свет, выражение']] },
    { id: 'Д8', rel: 'Волосы, этап 3 движка: причёски В1 как часть движка — код и пресеты; на головах Anny и на придуманных головах Г1, Г3 (по их форме).', name: 'Волосы: причёски на головах', st: 'mid', stt: 'работает',
      what: 'Четырнадцать причёсок В1 — пресеты частей (hair-v1-*): причёска — кусок головы, как нос или убор, берётся, меняется по id и убирается. Группы причёски названы (чёлка, затылок, пряди у лица, хвост, коса, пучки…): можно убрать группу или оставить только некоторые, сменить цвет, свет волос, физику. Причёска сажается на голову по её настоящей форме: по придуманной форме обтяжки, где она есть, иначе по коже; у черепа каждая точка — на том же расстоянии от настоящей поверхности головы, что в рисунке: корни и линия роста волос на коже. Голова, выросшая слоем позы, получает причёску, посаженную на неё заново. После «все пластилиновые!»: в свете — пучки волос шириной в сантиметр-два с тёмными проборами между ними, блик вдоль волос ломается по пучкам, контур тёмный в цвет волос, а не чёрный. Пряди — толщины В1 (утончённые вдвое, они оставляли щели и тёмные трещины на макушке).',
      verdict: 'Сидят на любой голове, в том числе на головах Г1 и Г3; линия роста волос ровная. Пластилина меньше: пряди читаются пучками волос; но крупные пряди В1 так и остались крупными плоскостями (так нарисованы причёски), это не исправлено. На мультяшной голове (тоновый свет) причёски В1 остаются в обычном свете — тонового света для них нет.',
      pics: [['engine/hair/styles-short.png', 'короткие и собранные: спереди, ¾, сбоку'], ['engine/hair/styles-long.png', 'длинные: спереди, ¾, сбоку'], ['engine/hair/styles-designed.png', 'на придуманных головах Г1 и Г3'], ['engine/hair/b1-side.png', 'В1 и движок рядом: покой и движения в те же мгновения']] },
    { id: 'Д9', rel: 'Волосы, этап 3 движка: в движении — симуляция В1 на шаге движка, столкновения с головой и кожей тела, ветер.', name: 'Волосы: в движении', st: 'mid', stt: 'работает',
      what: 'Каждая прядь — цепочка точек от головы; шаг движка ведёт её мелкими шагами по 1/240 с, всегда одинаковыми (при 20, 30, 60, 144 кадрах в секунду волосы движутся одинаково): тяжесть, воздух и ветер с порывами, тяга к причёске, жёсткость прядей, длины точно; соседние пряди держатся вместе (волосы — масса, а не ленты), прядь, лежавшая на теле, ложится на него так же. Сталкивается с головой (её форма, с челюстью) и с кожей тела между кадрами — в каждом мелком шаге она там, где была в это мгновение, а глубоко внутри тело знает, куда наружу; поверхности прядей кладутся на кожу. Это одно столкновение тела на всех — волосы, потом одежда. Покой — причёска, как она висит на стоящем теле. Петля продолжается, перемотка — заново. Ветер — пресеты: тихо, лёгкий (длинные волосы клонятся на 15–20°), порывы, сильный (на 60°).',
      verdict: 'Во всех движениях Kimodo и цепочках, целиком, и в сильном ветре: волосы целы, длины прядей точно, на месте не дрожат и не мерцают больше, чем сама голова (у Kimodo в беге она подрагивает); кувырок — масса волос, а не колючая куча, как у В1; петля без рывка; при любой частоте кадров одинаково; лёгкий ветер клонит длинные волосы на 15–20°, сильный — на 60°. Проверки с пределами, взятыми по тому, как это выглядит, — engine/check/quality.mjs --only hair. Слабое: широкая длинная прядь, изогнутая вбок в своей плоскости (через плечо, в кувырке), растягивает внешний край — мнётся; изнанка широкой массы волос над рукой и волосы, прижатые лицом к полу, уходят в тело внутри самой массы (не видно); в позе покоя (руки разведены) длинные волосы лежат на руках; хвост при поклоне держит свою дугу. Кадр с волосами — 18–30 мс; скорость для многих персонажей — позже.',
      pics: [['engine/hair/motion.png', 'в движениях Kimodo'], ['engine/hair/wind.png', 'ветер'], ['engine/hair/viewer-hair.png', '3D: причёска, движение, ветер']] },
    { id: 'Д10', rel: 'Волосы, этап 3 движка: волосы готовых голов Г1 и Г3 — та же симуляция; жёсткие, как были, или движутся.', name: 'Волосы: готовые головы', st: 'mid', stt: 'работает',
      what: 'Волосы голов Г1 и Г3 остались как нарисованы и по-прежнему жёсткие — если не сказать «движутся» (moves): тогда каждая лента-прядь и каждый пучок массы висят на цепочке той же симуляции, шапочка, пучки и резинки едут с головой. В покое — тот же вид (на голове — в пределах нескольких миллиметров), в движении не проходят сквозь плечи.',
      verdict: 'Рыжая, Альва и другие: в покое как были, в движении волосы ложатся на плечи и качаются, а не проходят сквозь тело, как жёсткие; соседние ленты держатся вместе, лежащие на спине ленты лежат на ней плашмя. Концы лент Г3 на спине расходятся — так они нарисованы (сужающиеся ленты, под ними ничего).',
      pics: [['engine/hair/ready.png', 'жёсткие и движутся: покой, оглядывается, идёт']] },
    { id: 'Д11', rel: 'Одежда, этап 4 движка: одна система одежды — ткань О3 как основа, вещи MakeHuman из О2 как исходные сетки, вещи О3, сшитые по телу; на всех телах движка (Д2–Д4) и на готовых головах (Д7).', name: 'Одежда: вещи и ткани на телах', st: 'mid', stt: 'работает',
      what: 'Вещь — часть персонажа (clothes): выкройка (15 вещей MakeHuman, блузка, кардиган, куртка, купальник, юбка-трапеция и шарф О3, высокий ворот Г1, капюшон голов), ткань (16 тканей О3 — пресеты: вес, растяжение, изгиб по Кавабате, трение, толщина, ветер), цвет; наряды — пресеты вещей; меняются по id поверх основы, как куски головы. Вещь кроится по телу: на любом теле Anny — женщине, мужчине, ребёнке, полном, деформированном — и на готовых головах. Капюшоны готовых голов — теперь ткань, а не жёсткая оболочка: не проходят сквозь плечи; готовые головы одеты в то, в чём были нарисованы.',
      verdict: 'Вещи садятся на всех восьми телах и одиннадцати готовых головах; капюшоны и ворот — ткань, не проходят сквозь плечи; рядом с О3 в те же моменты — то же или ближе к телу. Слабо: ткань крупнее, чем у О3 (точки в 2–3 см, рисуется мельче) — мелких складок нет; кожа под тесной одеждой на рисунке утоплена на 4 мм, как у О3.',
      pics: [['engine/clothes/bodies.png', 'на восьми телах: спереди, ¾, сбоку'], ['engine/clothes/heads.png', 'готовые головы Г1 и Г3 в своих нарядах'], ['engine/clothes/fabrics.png', 'одно платье в восьми тканях: шаг и сильный ветер'], ['engine/clothes/o3-side.png', 'О3 и движок рядом в те же моменты'], ['engine/clothes/viewer-clothes.png', '3D: одежда, ткань, силуэт, ветер']] },
    { id: 'Д12', rel: 'Одежда, этап 4 движка: в движении — ткань О3 на шаге движка (мелкие шаги XPBD), общие с волосами твёрдые тела движка, ветер волос.', name: 'Одежда: в движении', st: 'mid', stt: 'работает',
      what: 'Вся одежда фигуры — одна симуляция на шаге движка, мелкими шагами по 1/240 с (при любой частоте кадров одинаково): тяжесть, ветер (пресеты волос), длины, изгиб, что держит вещь, слои (блузка поверх юбки), тело — та же коллизия, что у волос (кожа между кадрами, своя конечность у рукава и штанины, середины треугольников, голова), пол. Сброс при перемотке — тело входит в позу из покоя вместе с тканью; петля — ткань едет с кожей. Волосы лежат поверх одежды.',
      verdict: 'В шаге, беге, прыжке, танце, поклоне, сидя, лёжа, кувырке и перекате ткань не проходит сквозь тело (проверено числами по всем движениям целиком); при перемотке одежда входит в позу вместе с телом; на петле без рывка; при 20–144 кадрах в секунду та же картина. Слабо: в беге высокое колено может выглянуть сквозь жёсткий колокол; ложась через колени, платье задирается выше, чем у О3; футболка в кувырке задирается; ткань не держится за пальцы и не ложится на кисть; стоя на месте ткань у тяжёлого мужчины дрожит на 1–3 см, у некоторых других — до сантиметра в нескольких точках; волосы поверх платья и блузки мерцают (на месте — до сантиметра), это ещё не сделано как надо.',
      pics: [['engine/clothes/motion.png', 'в движениях и цепочках Kimodo'], ['engine/clothes/hair.png', 'волосы поверх одежды; капюшон и ворот тканью'], ['engine/clothes/dress-walk.gif', 'платье-колокол: шаг'], ['engine/clothes/wind-walk.gif', 'кардиган, шифон и шарф: шаг на ветру'], ['engine/clothes/jeans-roll.gif', 'футболка и джинсы: кувырок'], ['engine/clothes/granny-sit.gif', 'свитер и юбка: сесть'], ['engine/clothes/hair-walk.gif', 'волосы на блузке: шаг'], ['engine/clothes/hood-look.gif', 'капюшон тканью: оглядывается']] },
    { id: 'Д13', rel: 'Одежда, этап 4 движка: силуэт О1 (колокол, трапеция, тюльпан, рукав-фонарик, клёш…) — форма, к которой тянется ткань О3, с силой; физика О1 заменена тканью О3.', name: 'Одежда: силуэт О1 как форма', st: 'mid', stt: 'работает',
      what: 'Силуэт О1 — пресет (22: восемь платьев, юбки в складку, рукава, штанины). Вещь кроится по нарисованной форме (у колокола больше ткани у подола, складки как рисунок) и тянется к ней, как форму несёт тело (облегающее — кожа, висящее ниже бёдер — таз), с силой: 1 — держит, как жёсткий подъюбник, 0 — висит свободно, как скроена. Где в форме стоит тело (колено, сидя, пол), ткань ложится на тело, а не тянется в него.',
      verdict: 'Колокол, А-силуэт, ампир, пышная юбка, баллон держатся при силе 1 (форма в пределах сантиметра) и висят складками лишней ткани при 0; сидя ткань ложится на тело, а не уходит в пол, как у О1. Слабее О1: тюльпан (сужение к подолу читается мало), лестница до знака не перенесена.',
      pics: [['engine/clothes/strengths.png', 'сила 0 … 1; восемь силуэтов при силе 1'], ['engine/clothes/o1-side.png', 'О1 и движок рядом: тот же силуэт']] },

    for (const it of g.items) {

let tab = 'pics';
function show(id) {
  if (!id) return overview();
  const it = all.find(x => x.id == id) || all[0]; cur = it; sel.value = it.id;
  side.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.id == it.id));
  view.innerHTML = `<a class="home" href="#">← Обзор всех путей</a><h2><span class="id">${it.id}</span>${it.name}<span class="st ${it.st}">${it.stt}</span></h2>
    <p class="rel">${it.rel || ''}</p><p class="what">${it.what}</p>${it.verdict ? `<p class="verdict">${it.verdict}</p>` : ''}${VIEW3D[it.id] ? `<div class="tabs"><button data-t="pics">Картинки</button><button data-t="3d">${it.id === 'В1' ? '3D: волосы в движении' : '3D: вращать и двигать'}</button></div>` : ''}<div class="grid"></div><div class="d3"></div>`;
  const grid = view.querySelector('.grid'), d3 = view.querySelector('.d3');
  const setTab = t => {
    tab = VIEW3D[it.id] ? t : 'pics';
    view.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === tab)));
    grid.style.display = tab === 'pics' ? '' : 'none';
    clearInterval(d3.timer); d3.classList.toggle('on', tab === '3d');
    d3.innerHTML = tab === '3d' ? `<div class="d3bar"><b>${it.id}</b><span>${it.name}</span><span class="note">${VIEW3D[it.id][1]}</span><button class="back">← Картинки</button></div><div class="d3box"><iframe class="v3d" src="${VIEW3D[it.id][0]}" title="3D: ${it.name}"></iframe><div class="v3dwait">собирается… первый показ — до минуты</div></div>` : '';
    if (tab !== '3d') return;
    d3.querySelector('.back').onclick = () => setTab('pics');
    const fr = d3.querySelector('iframe'), wait = d3.querySelector('.v3dwait'), t0 = Date.now(), errs = [];
    fr.onload = () => { try { fr.contentWindow.addEventListener('error', e => errs.push(e.message)); fr.contentWindow.addEventListener('unhandledrejection', e => errs.push(String(e.reason))); } catch (e) {} };
    d3.timer = setInterval(() => {
      let ready = false; try { ready = !!fr.contentDocument.getElementById('vpPanel') || (VIEW3D[it.id][0].includes('?live') && !!fr.contentWindow.__ready); } catch (e) {}
      if (ready) { wait.remove(); clearInterval(d3.timer); return; }
      const sec = Math.round((Date.now() - t0) / 1000);
      wait.textContent = errs.length ? 'не загрузилось: ' + errs[0] : sec > 180 ? 'не загрузилось за три минуты' : `собирается… ${sec} с (первый показ — до минуты)`;
      if (errs.length || sec > 180) clearInterval(d3.timer);
    }, 500);
  };
  addEventListener('keydown', e => { if (e.key === 'Escape' && tab === '3d' && !lb.classList.contains('on')) setTab('pics'); });
  view.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.t));
  setTab(tab);
  it.pics.forEach(([src, cap], k) => {
    const f = document.createElement('figure');
    f.innerHTML = `<img loading="lazy" src="${P + src}" alt="${cap}"><figcaption><b>${it.id}-${letters[k]}</b>${cap}</figcaption>`;
    f.onclick = () => openLb(k); grid.appendChild(f);
  });
  window.scrollTo(0, 0);
}
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbCap = document.getElementById('lbCap');
function openLb(k) { idx = (k + cur.pics.length) % cur.pics.length; const [src, cap] = cur.pics[idx]; lbImg.src = P + src; lbCap.innerHTML = `<b>${cur.id}-${letters[idx]}</b>${cap}`; lb.classList.add('on'); }
function closeLb() { lb.classList.remove('on'); lbImg.removeAttribute('src'); }
document.getElementById('lbPrev').onclick = e => { e.stopPropagation(); openLb(idx - 1); };
document.getElementById('lbNext').onclick = e => { e.stopPropagation(); openLb(idx + 1); };
document.getElementById('lbClose').onclick = closeLb;
lb.onclick = e => { if (e.target === lb || e.target.classList.contains('imgbox')) closeLb(); };
addEventListener('keydown', e => { if (!lb.classList.contains('on')) return; if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft') openLb(idx - 1); if (e.key === 'ArrowRight') openLb(idx + 1); });
addEventListener('hashchange', () => show(decodeURIComponent(location.hash.slice(1))));
show(decodeURIComponent(location.hash.slice(1)));
