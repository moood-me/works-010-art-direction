<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>VRM with MToon</title>
<!-- A VRM avatar as three-vrm draws it: the file's own MToon settings (shade colour and texture, toony-ness, rim,
     matcap, outline), or the same textures on a plain lit material, for comparison.
     ?vrm=<url of a .vrm>&mat=mtoon|plain|nooutline&yaw=0.5&view=full|bust -->
<style>html,body{margin:0;background:#d9d3ca;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from 'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js';
const qs = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#dcd6cd');
const camera = new THREE.PerspectiveCamera(22, innerWidth / innerHeight, 0.05, 50);
// the light three-vrm's own examples use: one sun from the front-top, nothing else
const sun = new THREE.DirectionalLight('#ffffff', Math.PI); sun.position.set(1, 1, 1).normalize(); scene.add(sun);
const loader = new GLTFLoader(); loader.register(p => new VRMLoaderPlugin(p));
const gltf = await loader.loadAsync(qs.get('vrm')), vrm = gltf.userData.vrm;
VRMUtils.rotateVRM0(vrm); scene.add(vrm.scene);
// arms down from the T-pose, a little
const hb = n => vrm.humanoid.getNormalizedBoneNode(n);
hb('leftUpperArm').rotation.z = -1.2; hb('rightUpperArm').rotation.z = 1.2; hb('leftLowerArm').rotation.z = -0.15; hb('rightLowerArm').rotation.z = 0.15;
const mat = qs.get('mat') || 'mtoon';
vrm.scene.traverse(o => {
  if (!o.isMesh) return;
  const ms = Array.isArray(o.material) ? o.material : [o.material];
  if (mat === 'nooutline') ms.forEach(m => { if (m.isOutline) m.visible = false; });
  if (mat === 'plain') o.material = ms.map(m => m.isOutline ? Object.assign(new THREE.MeshBasicMaterial(), { visible: false })
    : new THREE.MeshStandardMaterial({ map: m.map, color: m.color, roughness: 0.7, transparent: m.transparent, alphaTest: m.alphaTest, side: m.side, normalMap: m.normalMap, emissive: m.emissive, emissiveMap: m.emissiveMap }));
  if (!Array.isArray(o.material) || o.material.length === 1) o.material = Array.isArray(o.material) ? o.material[0] : o.material;
});
if (mat === 'plain') scene.add(new THREE.HemisphereLight('#ffffff', '#a09a90', 1.2));
if (qs.get('expr')) vrm.expressionManager?.setValue(qs.get('expr'), 1);
for (let i = 0; i < 30; i++) vrm.update(1 / 30);   // constraints and spring bones settle
const head = hb('head').getWorldPosition(new THREE.Vector3());
const view = qs.get('view') || 'full', yawBase = +(qs.get('yaw') ?? 0.45);
const target = view === 'bust' ? head.clone().add(new THREE.Vector3(0, 0.03, 0)) : new THREE.Vector3(0, head.y * 0.54, 0), dist = view === 'bust' ? 1.25 : head.y * 3.3;
window.__frame = yaw => {
  yaw = yaw ?? yawBase;
  camera.position.set(target.x + Math.sin(yaw) * dist, target.y + (view === 'bust' ? 0.03 : 0.1), target.z + Math.cos(yaw) * dist); camera.lookAt(target);
  vrm.update(1 / 30); renderer.render(scene, camera);
};
window.__frame();
window.__ready = true;
</script>
</body></html>
