<!doctype html>
<meta charset="utf-8">
<title>Ткань: кадры для сравнения</title>
<style>html, body { margin: 0; background: #cfc8bd; } canvas { display: block; width: 100vw; height: 100vh; }
.tag { position: fixed; left: 14px; top: 10px; font: 500 22px system-ui, sans-serif; color: #2b2723; }</style>
<canvas id="cv"></canvas><div class="tag" id="tag"></div>
<script type="module">
// The studio of experiments/cloth/index.html (same lights, floor, materials, hair and shoes carried by the skin, the
// skin sunk a little under close cloth, the camera following the pelvis as the page's does), drawing a run that
// export.mjs wrote, with the garments' points from one simulator (ours, blender, hood). Driven by shoot.cjs.
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { person, skinInto, parseGarment, fitted } from '../../../experiments/cloth/people.js';
import { FABRICS, nearestOn } from '../../../experiments/cloth/wardrobe.js';
const cv = document.getElementById('cv');
const bytes = name => import('../../../experiments/data/' + name + '.js').then(m => Uint8Array.from(atob(m.default), c => c.charCodeAt(0)).buffer);
const META = await (await fetch('../../../experiments/data/meta.json')).json();
const SKIN = { woman: '#e9bb9c', man: '#d8a585', child: '#f0c5a5' };

const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#cfc8bd');
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);
scene.add(new THREE.HemisphereLight('#fff4e6', '#5b544c', 1.0));
const key = new THREE.DirectionalLight('#fff0dc', 2.2); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -1.6, right: 1.6, top: 1.6, bottom: -1.6, near: 0.5, far: 12 }); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.015;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight('#cfe0ff', 1.2); scene.add(rim, rim.target);
const fill = new THREE.DirectionalLight('#ffe6cc', 0.4); scene.add(fill, fill.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#c9c1b5', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(400, 400, '#b5ac9f', '#bdb4a7'); grid.position.y = 0.0005; scene.add(grid);
function clothMaterial(color, F) {
  const m = new THREE.MeshPhysicalMaterial({ color, roughness: F.rough, sheen: F.sheen, sheenRoughness: 0.6, sheenColor: new THREE.Color(color).lerp(new THREE.Color('#ffffff'), 0.35), side: THREE.DoubleSide, transparent: !!F.opacity, opacity: F.opacity ?? 1 });
  m.onBeforeCompile = s => { s.fragmentShader = s.fragmentShader.replace('#include <color_fragment>', '#include <color_fragment>\nif (!gl_FrontFacing) diffuseColor.rgb *= 0.55;'); };
  return m;
}
function meshOf(pos, tris, mat) {
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(new THREE.BufferAttribute(tris, 1)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false; scene.add(m); return m;
}
function carried(body, pos, tris, color, rough) {
  const near = nearestOn(body.rest, pos), n = pos.length / 3, J = new Uint8Array(n * 4), W = new Uint8Array(n * 4);
  for (let i = 0; i < n; i++) for (let k = 0; k < 4; k++) { J[i * 4 + k] = body.joint[near[i] * 4 + k]; W[i * 4 + k] = body.weight[near[i] * 4 + k]; }
  return { mesh: meshOf(Float32Array.from(pos), tris, new THREE.MeshStandardMaterial({ color, roughness: rough, side: THREE.DoubleSide })), rest: Float32Array.from(pos), J, W };
}
const get = async (url, Kind) => new Kind(await (await fetch(url)).arrayBuffer());
let R = null;
const cam = { yaw: 0.6, pitch: 0.1, dist: 4.2 }, target = new THREE.Vector3(0, 0.9, 0);
window.__v = {
  async load(run, src, tag) {
    document.getElementById('tag').textContent = tag || '';
    const info = await (await fetch(run + '/run.json')).json(), O = info.outfit;
    const body = await person(THREE, bytes, META, O.who), E = await get(run + '/E.f32', Float32Array);
    const meshes = [{ body: true, mesh: meshOf(Float32Array.from(body.rest), body.tris, new THREE.MeshStandardMaterial({ color: SKIN[O.who], roughness: 0.62 })) }];
    for (const thing of [O.shoes, O.hair].filter(Boolean)) { const G = parseGarment(await bytes(thing[0])); meshes.push(carried(body, fitted(G, body.rest), G.tris, thing[1], thing === O.hair ? 0.55 : 0.6)); }
    const garments = [];
    for (const g of info.garments) {
      let pts; try { const r = await fetch(`${run}/${src}-${g.name}.f32`); if (!r.ok) continue; pts = new Float32Array(await r.arrayBuffer()); } catch { continue; }
      const tris = await get(`${run}/${g.name}-tris.u32`, Uint32Array), color = O.wear.find(w => w[0] === g.name)[2];
      garments.push({ g, pts, rest: await get(`${run}/${g.name}-rest.f32`, Float32Array), mesh: meshOf(new Float32Array(g.n * 3), tris, clothMaterial(color, FABRICS[g.fabric])) });
    }
    const all = garments.flatMap(G => Array.from(G.rest)), near = nearestOn(Float32Array.from(all), body.rest);
    const sink = Float32Array.from(near, (j, i) => { const dd = Math.hypot(all[j * 3] - body.rest[i * 3], all[j * 3 + 1] - body.rest[i * 3 + 1], all[j * 3 + 2] - body.rest[i * 3 + 2]); return 0.004 * (1 - Math.min(1, Math.max(0, (dd - 0.012) / 0.015))); });
    R = { info, body, E, meshes, garments, sink, frames: Math.min(info.frames, ...garments.map(G => G.pts.length / (G.g.n * 3))) };
    return R.frames;
  },
  show(f, v) {
    Object.assign(cam, v || {});
    const { body, E: EA, meshes, garments, sink } = R, E = Array.from({ length: 77 }, (_, j) => Array.from(EA.subarray((f * 77 + j) * 16, (f * 77 + j + 1) * 16)));
    const nrm = new Float32Array(body.N * 3);
    for (const it of meshes) {
      const pa = it.mesh.geometry.attributes.position;
      if (it.body) { skinInto(body.rest, body.nrm, body.joint, body.weight, 255, E, pa.array, nrm); for (let i = 0; i < body.N; i++) { const s = sink[i]; if (s) for (let c = 0; c < 3; c++) pa.array[i * 3 + c] -= nrm[i * 3 + c] * s; } }
      else skinInto(it.rest, null, it.J, it.W, 255, E, pa.array, null);
      pa.needsUpdate = true; it.mesh.geometry.computeVertexNormals();
    }
    for (const G of garments) { const pa = G.mesh.geometry.attributes.position; pa.array.set(G.pts.subarray(f * G.g.n * 3, (f + 1) * G.g.n * 3)); pa.needsUpdate = true; G.mesh.geometry.computeVertexNormals(); }
    // the camera on the pelvis, eased over the frames as the page's
    const hip = body.J[body.names.indexOf('Hips')], e = E[body.names.indexOf('Hips')];
    const fol = new THREE.Vector3(e[0] * hip.x + e[4] * hip.y + e[8] * hip.z + e[12], 0, e[2] * hip.x + e[6] * hip.y + e[10] * hip.z + e[14]);
    fol.y = Math.max(0.35, (e[1] * hip.x + e[5] * hip.y + e[9] * hip.z + e[13]) * 0.85 + body.height * 0.12);
    if (v && v.snap) target.copy(fol); else target.lerp(fol, 0.15);
    const cp = Math.cos(cam.pitch);
    camera.position.set(target.x + Math.sin(cam.yaw) * cp * cam.dist, target.y + Math.sin(cam.pitch) * cam.dist, target.z + Math.cos(cam.yaw) * cp * cam.dist);
    camera.lookAt(target);
    key.position.copy(target).add(new THREE.Vector3(-2.2, 3.6, 2.6)); key.target.position.copy(target);
    rim.position.copy(target).add(new THREE.Vector3(2.4, 2.2, -2.8)); rim.target.position.copy(target);
    fill.position.copy(target).add(new THREE.Vector3(2.5, 1.0, 2.0)); fill.target.position.copy(target);
    renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.render(scene, camera);
  },
};
window.__ready = true;
</script>
